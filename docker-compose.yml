name: verascribe
services:
  db:
    image: pgvector/pgvector:pg17
    ports: ['127.0.0.1:54329:5432']
    environment:
      POSTGRES_DB: verascribe
      POSTGRES_USER: verascribe
      POSTGRES_PASSWORD: local-development-only
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verascribe -d verascribe']
      interval: 2s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: [embeddings]
    ports: ['127.0.0.1:11434:11434']
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  ollama-models:
