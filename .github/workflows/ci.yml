name: CI
on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: verascribe_test
          POSTGRES_USER: verascribe
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verascribe -d verascribe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_MODEL_TESTS: 'true'
      TEST_DATABASE_URL: postgresql://verascribe:ci-only-password@localhost:5432/verascribe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .local/models
          key: verification-2a4f614a701367a02d51389039afc998faeda637-${{ runner.os }}-a09144355adeed5f58c8ed011d209bf8ee5a1fec-q8
      - run: npm ci
      - run: npm run rerank:smoke
      - run: npm run verify:smoke
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: node --import tsx apps/api/scripts/evaluate-verification.ts --check
      - run: docker build -t verascribe-ci .
      - name: Smoke test release image
        run: |
          docker run -d --name verascribe-smoke -p 127.0.0.1:3301:3001 verascribe-ci
          trap 'docker logs verascribe-smoke; docker rm -f verascribe-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3301/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3301/api/health
          curl --fail http://127.0.0.1:3301/ | grep 'VeraScribe'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"question":"hello"}' http://127.0.0.1:3301/api/query)" = 503
          test "$(docker exec verascribe-smoke id -u)" != 0
